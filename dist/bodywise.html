    keywords: ['muscle', 'contraction', 'atp', 'actin', 'myosin', 'sarcomere', 'sliding filament', 'cross-bridge', 'calcium', 'troponin', 'tropomyosin', 'creatine phosphate', 'fatigue'],
    why: 'Every movement, every breath and much of your body heat come from skeletal muscle contraction. The mechanism connects nerves, calcium, ATP, oxygen and the cardiovascular system.',
    objectives: ['Describe the sarcomere and its filaments.', 'Explain the sliding filament mechanism.', 'Describe the role of calcium and ATP in contraction and relaxation.', 'Name three ways muscle regenerates ATP.'],
    intro: 'Muscle fibres are packed with two kinds of protein strands: thin actin and thick myosin. When a muscle contracts, myosin heads grab actin and pull it, so the strands slide past each other and the muscle shortens. Calcium is the on switch. ATP is the fuel, and surprisingly, ATP is also needed to let go.',
    detail: [
      'A skeletal muscle fibre is a long cell containing myofibrils. Each myofibril is a chain of sarcomeres, the contractile units, bounded by Z discs. Thin filaments (actin) attach to the Z discs; thick filaments (myosin) sit in the middle. During contraction, the filaments themselves do not shorten; they slide, bringing the Z discs closer.',
      'At rest, the protein tropomyosin covers the myosin-binding sites on actin, held in place by troponin.',
      'A motor neuron releases acetylcholine at the neuromuscular junction. The muscle fibre fires an action potential that travels into T-tubules and triggers the sarcoplasmic reticulum (SR) to release calcium. Calcium binds troponin, which shifts tropomyosin and exposes the binding sites.',
      'The cross-bridge cycle: an energised myosin head binds actin; it pivots in the power stroke, pulling actin towards the centre and releasing ADP and phosphate; a new ATP binds and the head detaches; ATP is hydrolysed, re-cocking the head. The cycle repeats while calcium and ATP are present.',
      'Relaxation needs ATP too: calcium is actively pumped back into the SR, tropomyosin covers the sites again, and the filaments slide back passively.',
      'Muscle stores only a few seconds of ATP. It regenerates ATP from creatine phosphate (very fast, about 10–15 seconds), from anaerobic glycolysis (fast, produces lactate) and from aerobic respiration in mitochondria (slower to start, far more ATP per glucose, needs oxygen).'
    ],
    advanced: 'Force depends on the number of motor units recruited and their firing frequency; high-frequency stimulation produces tetanus (a smooth sustained contraction). The length–tension relationship means force is greatest at intermediate sarcomere lengths where actin and myosin overlap optimally. Rigor mortis occurs after death because, without ATP, myosin heads cannot detach from actin.',
    steps: [
      'Motor neuron releases acetylcholine at the neuromuscular junction.',
      'Muscle action potential spreads along the membrane and into T-tubules.',
      'Sarcoplasmic reticulum releases calcium.',
      'Calcium binds troponin; tropomyosin moves off actin’s binding sites.',
      'Myosin heads bind, perform the power stroke, then detach when ATP binds.',
      'Calcium is pumped back (using ATP) and the muscle relaxes.'
    ],
    diagram: 'sarcomere',
    analogy: 'Imagine a team pulling a rope hand over hand during a tug of war. Each hand (myosin head) grabs, pulls, lets go and grabs again further along. The rope (actin) moves; the people stay put. Calcium is the referee’s whistle; ATP is the energy to let go and reach again.',
    altAnalogy: 'Think of rowers in a long canoe. Each oar (myosin head) dips, pulls and lifts. Many oars out of sync keep the canoe moving smoothly. Without energy (ATP), the oars stay stuck in the water.',
    joke: 'Mitochondria are the power station of the cell. Yes, everyone says it. Muscle is why it keeps being true.',
    connections: [
      { sys: 'ns', text: 'Motor neurons trigger every skeletal muscle contraction.', lesson: 'm2-l5' },
      { sys: 'cv', text: 'Working muscles depend on increased blood flow and oxygen delivery.', lesson: 'm13-l7' },
      { sys: 'en', text: 'Insulin drives glucose into muscle; parathyroid hormone controls blood calcium.', lesson: 'm6-l4' },
      { sys: 'rs', text: 'Muscle carbon dioxide output drives breathing during exercise.', lesson: 'm4-l2' }
    ],
    scenario: { title: 'Worked example: carrying a heavy jerrycan', text: 'You lift a 20-litre jerrycan. Your brain recruits more motor units in the forearm and shoulder; each fires faster, producing a sustained (tetanic) contraction. For the first seconds, stored ATP and creatine phosphate supply energy. As you keep walking, glycolysis and then aerobic respiration take over, and blood flow to the working muscles rises. If the grip becomes tiring, fatigue reflects changes in ion balance, metabolites and energy supply inside the fibres, not simply “lactic acid poisoning”.' },
    misconceptions: [
      { myth: 'Actin and myosin filaments shorten during contraction.', fact: 'They slide past each other; the sarcomere shortens, the filaments do not.' },
      { myth: 'ATP is only needed for the power stroke.', fact: 'ATP is needed to detach myosin from actin and to pump calcium back for relaxation.' },
      { myth: 'Lactic acid causes the soreness you feel a day or two after exercise.', fact: 'Lactate is cleared within an hour or so; delayed soreness is linked to muscle micro-damage and inflammation.' }
    ],
    check: [
      { id: 'm9l2-q1', type: 'label', prompt: 'Label the sarcomere.', diagram: 'sarcomere', options: ['Actin (thin filament)', 'Myosin (thick filament)', 'Z disc', 'M line'], answers: { 1: 'Actin (thin filament)', 2: 'Myosin (thick filament)', 3: 'Z disc', 4: 'M line' }, explain: 'Thin actin filaments anchor at the Z discs; thick myosin filaments sit in the middle, centred on the M line.' },
      { id: 'm9l2-q2', type: 'mcq', prompt: 'What does calcium bind to in order to start contraction?', options: ['Myosin', 'Actin', 'Troponin', 'Tropomyosin'], answer: 2, explain: 'Calcium binds troponin, which pulls tropomyosin away from the binding sites on actin.' },
      { id: 'm9l2-q3', type: 'tf', prompt: 'Muscle needs ATP to relax.', answer: true, explain: 'True. ATP releases myosin from actin, and the SR calcium pump uses ATP to remove calcium.' },
      { id: 'm9l2-q4', type: 'mcq', prompt: 'Which system regenerates ATP fastest at the start of a sprint?', options: ['Aerobic respiration', 'Creatine phosphate', 'Fat oxidation', 'Protein breakdown'], answer: 1, explain: 'Creatine phosphate transfers its phosphate to ADP almost instantly, supplying the first several seconds.' },
      { id: 'm9l2-q5', type: 'short', prompt: 'Explain why rigor mortis happens.', keywords: [['atp']], model: 'After death, ATP runs out, so myosin heads cannot detach from actin and muscles stay rigid.', explain: 'Detachment of myosin from actin requires ATP binding. Without it, cross-bridges lock.' }
    ],
    summary: 'A nerve signal triggers calcium release; calcium binds troponin, uncovering actin; myosin heads pull actin in repeated cross-bridge cycles powered by ATP. ATP is also needed for detachment and relaxation. Muscle regenerates ATP from creatine phosphate, glycolysis and aerobic respiration.',
    terms: [
      { t: 'Sarcomere', d: 'Contractile unit of a myofibril, from Z disc to Z disc.' },
      { t: 'Actin', d: 'Thin filament protein pulled by myosin.' },
      { t: 'Myosin', d: 'Thick filament protein whose heads form cross-bridges.' },
      { t: 'Troponin', d: 'Calcium-binding protein that moves tropomyosin.' },
      { t: 'Sarcoplasmic reticulum', d: 'Calcium store inside the muscle fibre.' }

  F['m10-l1'] = {
    keywords: ['immune', 'immunity', 'innate', 'adaptive', 'antibody', 'antibodies', 'lymphocyte', 't cell', 'b cell', 'macrophage', 'neutrophil', 'vaccine', 'vaccination', 'memory', 'infection', 'inflammation', 'white blood cell'],
    why: 'The immune system protects every other system. Understanding its two arms explains inflammation, fever, vaccines and why a second infection is often milder.',
    objectives: ['Describe the barrier, innate and adaptive defences.', 'Name the main cells of each arm.', 'Explain how innate and adaptive responses are linked.', 'Explain immune memory and vaccination.'],
    intro: 'Your immune defence has layers. Barriers like skin and mucus keep most microbes out. If something gets through, the innate system responds within minutes to hours, attacking anything that looks foreign in general ways. Over days, the adaptive system builds a precise response to that specific invader, and it remembers it for next time.',
    detail: [

      'Innate response: fast and general. Neutrophils and macrophages engulf microbes (phagocytosis); natural killer cells destroy infected cells; complement proteins tag and puncture microbes. Inflammation brings blood, fluid and cells to the site. Fever may follow.',

    steps: [

      'A microbe enters through a cut; resident macrophages detect it.',

    altAnalogy: 'Innate immunity is a smoke alarm: it reacts to any smoke. Adaptive immunity is a security system that learns a specific face and alerts instantly next time that face appears.',
    joke: 'Your adaptive immune system never forgets a face. It is the friend who remembers exactly what you said at a party ten years ago.',
    connections: [

    ],
    scenario: { title: 'Worked example: why the second measles exposure is different', text: 'On a first exposure to a virus, the adaptive system needs days to select and expand the right T and B cells, so the illness can develop before the response peaks. After recovery, or after vaccination, memory cells remain. On a later exposure they recognise the antigen within hours and produce high-affinity antibodies quickly, often clearing the virus before illness develops. This is the physiology that makes vaccination programmes protect communities.' },
    misconceptions: [

      { myth: 'Antibodies kill microbes on their own.', fact: 'Antibodies mostly neutralise and tag; phagocytes and complement do much of the killing.' },
      { myth: 'Vaccines give you the disease.', fact: 'Vaccines present antigens in a safe form so memory develops without the illness. Mild short-term reactions reflect the immune response.' }
    ],
    check: [
      { id: 'm10l1-q1', type: 'label', prompt: 'Label the layers of defence in time order.', diagram: 'immune', options: ['Barriers', 'Innate response', 'Adaptive response', 'Memory'], answers: { 1: 'Barriers', 2: 'Innate response', 3: 'Adaptive response', 4: 'Memory' }, explain: 'Barriers act constantly, innate within minutes to hours, adaptive over days, and memory lasts for years.' },
      { id: 'm10l1-q2', type: 'mcq', prompt: 'Which cells secrete antibodies?', options: ['Neutrophils', 'Plasma cells (from B cells)', 'Cytotoxic T cells', 'Macrophages'], answer: 1, explain: 'Activated B cells become plasma cells, which secrete large amounts of antibody.' },
      { id: 'm10l1-q3', type: 'tf', prompt: 'The innate response is specific to one particular microbe.', answer: false, explain: 'False. Innate responses recognise general features shared by many microbes. Specificity is a feature of the adaptive response.' },
      { id: 'm10l1-q4', type: 'mcq', prompt: 'What links the innate response to the adaptive response?', options: ['Platelets', 'Dendritic cells presenting antigen', 'Red blood cells', 'Mucus'], answer: 1, explain: 'Dendritic cells capture antigen at the site and present it to T cells in lymph nodes, starting the adaptive response.' },
      { id: 'm10l1-q5', type: 'short', prompt: 'Why is a secondary immune response faster?', keywords: [['memory']], model: 'Memory B and T cells from the first exposure are already present and respond quickly and strongly.', explain: 'The first response leaves expanded populations of memory cells that do not need to be selected from scratch.' }

    terms: [

    keywords: ['oxygen cascade', 'oxygen delivery', 'exercise', 'working muscle', 'mitochondria', 'bohr', 'haemoglobin', 'hemoglobin', 'altitude', 'cardiac output', 'oxygen', 'muscles'],

    intro: 'Oxygen moves downhill all the way from the air to your mitochondria. At each step, its partial pressure drops a bit, and that drop is what pushes it forward. During exercise, every system along the route turns up its effort: you breathe more, your heart pumps more, your muscles open more capillaries, and haemoglobin lets go of oxygen more easily.',
    detail: [
      'Air at sea level has an oxygen partial pressure of about 160 mmHg. Humidifying it in the airways and mixing it with old air in the lungs lowers it to about 100–104 mmHg in the alveoli.',
      'Oxygen diffuses into pulmonary capillaries; arterial blood leaves the lungs at about 95–100 mmHg, with haemoglobin about 97–98 percent saturated. The left ventricle pumps it out to the body.',

      'During exercise: ventilation rises (driven by carbon dioxide, signals from moving limbs and the brain); cardiac output rises several-fold through higher heart rate and stroke volume; blood is redirected to working muscle; more muscle capillaries open; and warmer, more acidic, carbon dioxide-rich muscle makes haemoglobin release oxygen more readily (the Bohr effect). Myoglobin inside muscle fibres helps move oxygen to mitochondria.',
      'Over weeks to months of altitude exposure, low oxygen delivery to the kidneys increases erythropoietin, raising red cell mass and oxygen-carrying capacity. Regular endurance training also adds mitochondria and capillaries to muscle.'
    ],
    advanced: 'Oxygen delivery = cardiac output × arterial oxygen content. Oxygen consumption (Fick principle) = cardiac output × (arterial − venous oxygen content). During heavy exercise, both terms rise: cardiac output can increase four- to fivefold in trained people, and muscle extracts much more oxygen, so the arteriovenous difference widens.',
    steps: [

      { id: 'm13l7-q2', type: 'tf', prompt: 'During exercise, increased cardiac output contributes more to oxygen delivery than increasing arterial saturation.', answer: true, explain: 'True. Arterial blood is already about 97–98% saturated at rest, so more flow and more extraction provide most of the increase.' },

<script>
/* BodyWise — extra learning content: daily body mysteries, jokes that lead
   into real science, memory tricks, pathway caveats and cardiac-cycle stages. */
(function (BW) {
  'use strict';

  /* Each mystery: a question to puzzle over, then the explanation. */
  BW.mysteries = [
    { q: 'Why does your heart beat faster when you run, even though you never consciously told it to?', sys: 'ns', lesson: 'm5-l5',
      a: 'Your autonomic nervous system does it for you. As you start moving, the brain turns up sympathetic signals and turns down vagal (parasympathetic) brake on the SA node, so heart rate rises. Adrenaline from the adrenal medulla adds to the effect, and signals from working muscles and rising carbon dioxide keep it going. You never need to think about it.' },
    { q: 'When you hold your breath, is the desperate urge to breathe caused by running out of oxygen?', sys: 'rs', lesson: 'm4-l2',
      a: 'Mostly not. The main trigger is carbon dioxide building up and making the blood slightly more acidic. Chemoreceptors in the brainstem and in the carotid and aortic bodies detect it and the respiratory centre insists on a breath, usually well before oxygen falls dangerously low.' },
    { q: 'Why can you feel light-headed for a second when you stand up quickly?', sys: 'cv', lesson: 'm3-l7',
      a: 'Gravity pulls blood into your leg veins, so less returns to the heart and blood pressure dips briefly. Baroreceptors notice within a heartbeat or two and the brainstem raises heart rate and tightens blood vessels. The light-headed moment is the gap before the reflex catches up.' },
    { q: 'Why is your urine darker after a hot day with little to drink?', sys: 're', lesson: 'm8-l2',
      a: 'Sweating concentrates your plasma, so the hypothalamus triggers antidiuretic hormone (ADH). ADH inserts water channels in the kidney’s collecting ducts, pulling water back into the blood. Less water leaves, so the same waste is dissolved in less urine.' },
    { q: 'Why does a fatty meal keep you feeling full for longer than a sugary drink?', sys: 'di', lesson: 'm7-l1',
      a: 'When fat reaches the small intestine, it triggers the hormone cholecystokinin (CCK). CCK releases bile and pancreatic enzymes and also slows how fast the stomach empties, so food stays with you longer.' },
    { q: 'If you have a fever, why do you shiver and feel cold even though you are hot?', sys: 'ns', lesson: 'm11-l3',
      a: 'Immune signals raise the hypothalamus’s temperature set point. Your actual temperature is now below the new target, so the body responds as if it is cold: shivering and narrowing skin blood vessels until it reaches the higher set point.' },
    { q: 'Why do muscles become stiff after death?', sys: 'ms', lesson: 'm9-l2',
      a: 'Myosin needs a fresh ATP molecule to let go of actin. After death, ATP runs out, so the cross-bridges stay locked and muscles stiffen (rigor mortis) until the proteins break down.' },
    { q: 'Why do so many distance runners train in high-altitude towns like Iten?', sys: 're', lesson: 'm13-l7',
      a: 'At altitude, each breath carries less oxygen. Kidney cells sense the lower oxygen delivery and release more erythropoietin (EPO), which drives the bone marrow to make more red blood cells. More haemoglobin can help deliver oxygen when racing lower down, although the effect varies between people.' },
    { q: 'Why is a second infection with the same virus often milder than the first?', sys: 'im', lesson: 'm10-l1',
      a: 'The first infection leaves memory B and T cells. Next time, they recognise the virus within hours and produce strong, specific antibodies quickly, often clearing it before illness develops. Vaccines create this memory without the illness.' },
    { q: 'Why does your mouth go dry when you are nervous before a presentation?', sys: 'ns', lesson: 'm5-l5',
      a: 'Sympathetic activity shifts the salivary glands towards a smaller amount of thicker saliva, while parasympathetic “rest and digest” activity, which drives watery saliva, is turned down.' },
    { q: 'Why does a very salty meal make you thirsty?', sys: 'en', lesson: 'm1-l5',
      a: 'Absorbed salt raises the concentration of your extracellular fluid. Water moves out of cells by osmosis, including osmoreceptor cells in the hypothalamus, which trigger thirst and ADH release so you drink and keep water.' },
    { q: 'Why do people breathe more in early pregnancy, long before the bump is big?', sys: 'rp', lesson: 'm12-l4',
      a: 'Progesterone makes the breathing centre more sensitive to carbon dioxide, so each breath gets deeper. Slightly lower maternal carbon dioxide helps carbon dioxide move from the fetus across the placenta.' }
  ];

  /* Jokes always lead into the real explanation. */
  BW.jokes = [
    { joke: 'Your mitochondria are busy making ATP while you are busy making excuses not to exercise.', lesson: 'm9-l2',
      science: 'Mitochondria use oxygen to turn the energy in glucose and fat into ATP. When you exercise, muscle ATP use rises sharply, so the mitochondria work harder, and regular training actually adds more mitochondria to muscle.' },
    { joke: 'Your kidneys are the body’s water-management team. Excellent accountants, but they prefer urine to spreadsheets.', lesson: 'm8-l2',
      science: 'Adult kidneys filter roughly 180 litres of plasma a day, then reabsorb nearly all of it, leaving about 1 to 2 litres of urine. ADH and aldosterone fine-tune exactly how much water and salt is kept.' },
    { joke: 'Your heart does not get weekends off. It has the most intense full-time job in the body.', lesson: 'm3-l4',
      science: 'At about 70 beats a minute, the heart beats roughly 100,000 times a day. Cardiac muscle rests between beats rather than between shifts, and the SA node sets the rhythm without any instruction from you.' },
    { joke: 'Negative feedback is the body’s thermostat. Unlike some humans, it actually responds to feedback.', lesson: 'm1-l4',
      science: 'In negative feedback, a change is detected and the response pushes it back the other way. That is how temperature, glucose and blood pressure stay in their normal ranges.' },
    { joke: 'Insulin is a key for certain cells. Glucose without it is a delivery rider standing outside a locked gate.', lesson: 'm6-l4',
      science: 'Insulin causes muscle and fat cells to move GLUT4 transporters to their surface so glucose can enter. The brain and liver take up glucose largely without needing insulin, so the analogy fits muscle and fat best.' },
    { joke: 'Haemoglobin is a bus with four seats for oxygen. It picks up in the lungs and drops off where the party is: working muscle.', lesson: 'm13-l7',
      science: 'Each haemoglobin molecule can carry four oxygen molecules. Warm, acidic, carbon dioxide-rich muscle makes haemoglobin release oxygen more easily (the Bohr effect).' },
    { joke: 'The sodium–potassium pump is the club bouncer of the cell: three sodium out, two potassium in, and it charges one ATP at the door.', lesson: 'm1-l5',
      science: 'The pump uses one ATP to move three sodium ions out and two potassium ions in. The gradients it builds power nerve signals and many other transporters.' },
    { joke: 'Your diaphragm is the hardest-working muscle you forget about until you get hiccups.', lesson: 'm4-l2',
      science: 'The diaphragm contracts with every quiet breath, pulling air in by lowering pressure in the chest. A hiccup is a sudden involuntary diaphragm contraction followed by the vocal cords snapping shut, which makes the “hic”.' },
    { joke: 'Osmosis: water heads to where things are more crowded, like passengers rushing to the busiest matatu stage.', lesson: 'm1-l5',
      science: 'Water moves across a membrane towards the side with more dissolved particles. That is why a cell in salty fluid shrinks and a cell in very dilute fluid swells.' }
  ];

  /* Memory tricks, one per written lesson. */
  BW.memoryTricks = {
    'm1-l3': 'Stimulus → Receptor → Control centre → Effector → Response: “Some Really Clever Engineers Respond.”',
    'm1-l4': 'Negative feedback Nudges back. Positive feedback Pushes further, and needs an outside Pause button (birth, a sealed clot).',
    'm1-l5': '3 Na⁺ out, 2 K⁺ in: “Salt leaves the cell, bananas come home.” (Bananas are rich in potassium.)',
    'm2-l5': 'Sodium Swims in on the way up; Potassium Paddles out on the way down.',
    'm3-l4': 'LAB RAT: Left Atrium has the Bicuspid (mitral) valve; Right Atrium has the Tricuspid.',
    'm3-l7': 'Pressure = Pump × Pipes: cardiac output times peripheral resistance.',
    'm4-l2': 'Gases roll downhill: from high partial pressure to low, no pump required.',
    'm5-l5': 'Sympathetic = Stress and Speed. Parasympathetic = Peace and Plates (rest and digest).',
    'm6-l4': 'Insulin puts glucose IN. GlucaGON: the glucose is GONE, so the liver makes more.',
    'm7-l1': 'Digestion chops; absorption carries across. The small intestine does most of both.',
    'm8-l2': 'Filter, Reclaim, Send: excretion = filtration − reabsorption + secretion.',
    'm8-l6': 'Renin Rings the alarm, Angiotensin II squeezes, Aldosterone saves salt.',
    'm9-l2': 'Calcium unlocks actin; ATP lets myosin let go.',
    'm10-l1': 'Innate is Instant and general. Adaptive is slow, Accurate and Archives a memory.',
    'm11-l3': 'Too hot: open the vents (sweat, wide skin vessels). Too cold: shut the windows and shiver.',
    'm12-l4': 'hCG = “hold the Corpus luteum Going.”',
    'm13-l7': 'Oxygen rolls downhill: 160 → 104 → 98 → 40 → a few mmHg.'
  };

  /* Pathways are simplified; these notes give the important details and exceptions. */
  var caveats = {
    'breath-to-muscle': ['About 98% of oxygen travels bound to haemoglobin; only a small fraction is dissolved in plasma.', 'In short bursts, muscle also makes ATP without oxygen (creatine phosphate, anaerobic glycolysis).', 'Muscle holds a small oxygen store of its own in myoglobin.', 'Carbon dioxide makes the return trip mostly as bicarbonate.'],
    'meal-to-energy': ['Starch is only one fuel: fats travel in lymph as chylomicrons and proteins arrive as amino acids.', 'Fructose and galactose are absorbed too and are mostly converted by the liver.', 'The liver sees absorbed glucose first, through the portal vein, and stores much of it as glycogen.', 'The brain, liver and red blood cells take up glucose largely without insulin.', 'Insulin release starts before glucose rises, helped by gut hormones and nerve signals during eating.'],
    'sweat-to-thirst': ['Sweat is less salty than plasma, so losing it makes the remaining plasma more concentrated.', 'Large volume losses also trigger ADH and the renin–angiotensin–aldosterone system through pressure sensors.', 'Thirst can lag behind need, especially in older adults.', 'Drinking eases thirst before the water is even absorbed, thanks to signals from the mouth and throat.'],
    'bleed-to-rbc': ['Plasma volume recovers within hours as fluid shifts in from tissues and as you drink.', 'New red cells take about a week to start appearing and several weeks to restore numbers, and need enough iron.', 'Severe blood loss is a medical emergency; these reflexes buy time but cannot replace treatment.']
  };
  BW.paths.forEach(function (p) {
    p.caveats = caveats[p.id] || [];
    if (p.id === 'meal-to-energy' && !p.steps.some(function (s) { return s.sys === 'cv'; })) {
      p.steps.splice(2, 0, { sys: 'cv', title: 'Blood carries glucose', text: 'Absorbed glucose travels in the hepatic portal vein to the liver, then in the general circulation to every tissue.', lesson: 'm7-l1' });
    }
  });

  /* The cardiac cycle, stage by stage, for the interactive heart. */
  BW.cardiacStages = [
    { name: 'Ventricular filling', phase: 'Diastole', contract: [], av: 'open', sl: 'closed', flow: ['veins', 'av'], sound: '',
      text: 'All four chambers are relaxed. Blood flows in from the veins, through the atria and the open AV valves, straight into the ventricles. Most ventricular filling happens now, without any pumping.' },
    { name: 'Atrial contraction', phase: 'Atrial systole', contract: ['ra', 'la'], av: 'open', sl: 'closed', flow: ['av'], sound: '',
      text: 'The SA node fires and the atria contract, topping up the ventricles with the last part of their filling.' },
    { name: 'Isovolumetric contraction', phase: 'Ventricular systole begins', contract: ['rv', 'lv'], av: 'closed', sl: 'closed', flow: [], sound: 'lub',
      text: 'The ventricles start contracting. Their pressure rises above the atria, so the AV valves snap shut: the first heart sound, “lub”. All valves are closed, so volume stays the same while pressure builds.' },
    { name: 'Ventricular ejection', phase: 'Ventricular systole', contract: ['rv', 'lv'], av: 'closed', sl: 'open', flow: ['out'], sound: '',
      text: 'Ventricular pressure now exceeds pressure in the pulmonary trunk and aorta, so the semilunar valves open and blood is ejected: the right side to the lungs, the left side to the body.' },
    { name: 'Isovolumetric relaxation', phase: 'Diastole begins', contract: [], av: 'closed', sl: 'closed', flow: ['veins'], sound: 'dub',
      text: 'The ventricles relax and their pressure drops below the arteries, so the semilunar valves close: the second heart sound, “dub”. Once ventricular pressure falls below atrial pressure, the AV valves open and filling starts again.' }
  ];

  /* Short tutor-style microcopy, used sparingly. */
  BW.voiceLines = {
    slowDown: 'Let’s slow this down. Biology is complicated enough without us speed-running it.',
    twoSystems: 'Good question! This is where two body systems start working together.',
    almost: 'Almost. You have the right idea, but one important step is missing.',
    groupChat: 'Congratulations! You have successfully followed the body’s internal group chat.'
  };
})(window.BW = window.BW || {});

</script>
<script>
/* BodyWise — detail for the Body Connection Map and scenario mode.
   For every relationship: what each system gives the other, the mechanism,
   and whether it is a regulatory feedback loop (drawn with arrows both ways).
   All of this is an educational simplification of normal physiology. */
(function (BW) {
  'use strict';
  function D(a, b, aGives, bGives, mechanism, loop) { return { key: a + '-' + b, aGives: aGives, bGives: bGives, mechanism: mechanism, loop: !!loop }; }

  var details = [
    D('cv', 'rs', 'Pumps oxygen-poor blood through the lungs so it can be reloaded.', 'Loads oxygen into the blood and removes carbon dioxide from it.',
      'The right ventricle pumps blood returning from the body into the pulmonary arteries. In the alveolar capillaries, oxygen diffuses into the blood because its partial pressure is higher in alveolar air, and carbon dioxide diffuses out because it is higher in the blood. The left heart then pumps the reloaded blood to the tissues, which use oxygen and add carbon dioxide, and the cycle repeats. Gas exchange works only if airflow and blood flow are both adequate and well matched.'),
    D('cv', 're', 'Delivers about a fifth of cardiac output, and the pressure that drives filtration.', 'Controls blood volume through sodium and water excretion; releases renin when pressure falls and erythropoietin when oxygen delivery falls.',
      'Pressure in the glomerular capillaries pushes plasma into the nephrons. When kidney perfusion falls, granular cells release renin; angiotensin II constricts arterioles and aldosterone makes the kidneys keep sodium, and water follows, so volume and pressure rise and renin release falls again. When pressure stays high, the kidneys excrete more sodium and water, lowering volume. Because volume sets how much blood returns to the heart, this loop makes the kidneys the long-term regulators of blood pressure.', true),
    D('cv', 'ns', 'Sends pressure information from baroreceptors; supplies the brain with oxygen and glucose.', 'Sets heart rate, contraction strength and blood vessel diameter through autonomic nerves.',
      'Baroreceptors in the carotid sinus and aortic arch stretch with every beat and report pressure to the medulla. If pressure rises, vagal output increases and sympathetic output falls, slowing the heart and relaxing arterioles; if pressure falls, the reverse happens. The new pressure is detected straight away, closing the loop within seconds. The brain itself depends on steady blood flow, which this reflex helps protect.', true),
    D('cv', 'en', 'Carries hormones to every tissue; stretched atria release ANP, a hormone that promotes sodium loss.', 'Adrenaline speeds the heart; ADH, angiotensin II and aldosterone raise volume and resistance; ANP lowers volume.',
      'Hormones only reach their targets because the blood carries them. In return, several hormones tune the circulation: adrenaline increases heart rate and contractility, angiotensin II and high ADH constrict vessels, and aldosterone and ADH increase volume. When volume rises, stretched atria release ANP, which helps the kidneys excrete sodium and water. Opposing hormones like these keep pressure and volume within range.', true),
    D('cv', 'di', 'Supplies blood to the gut and carries absorbed nutrients to the liver in the hepatic portal vein.', 'Absorbs nutrients, water and electrolytes into the blood.',
      'After a meal, blood flow to the gut increases. Sugars and amino acids absorbed by the villi enter capillaries that drain into the hepatic portal vein, so the liver processes them first; fats enter lymph and reach the blood near the heart. The blood then distributes these nutrients to every tissue.'),
    D('cv', 'ms', 'Delivers oxygen, glucose and fatty acids to muscle; removes carbon dioxide, lactate and heat.', 'Contracting leg muscles squeeze veins to return blood (the muscle pump); muscle metabolites dilate local vessels; red bone marrow makes blood cells.',
      'When muscle works harder, it releases metabolites such as carbon dioxide, hydrogen ions, potassium and adenosine that dilate its own arterioles, increasing local flow. At the same time, sympathetic activity raises heart rate and narrows vessels in less active organs, redirecting cardiac output to muscle. Rhythmic contractions squeeze leg veins and push blood back to the heart, which supports stroke volume. When effort stops, metabolites wash out and flow falls back.', true),
    D('cv', 'im', 'Carries white blood cells and antibodies around the body.', 'Inflammatory signals widen and loosen local vessels so cells and proteins can leave; lymphatics return leaked fluid to the blood.',
      'At a site of injury or infection, signals such as histamine dilate local blood vessels and make capillary walls leakier. White cells in the passing blood slow down, stick to the vessel wall and squeeze out into the tissue, guided by chemical signals. This causes redness, warmth and swelling. Inflammation is normally local; when it becomes widespread, as in severe infection, it can lower blood pressure, which is a medical emergency.'),
    D('cv', 'rp', 'Supplies the uterus and placenta with blood.', 'Pregnancy hormones expand blood volume and relax vessels; the placenta exchanges gases, nutrients and wastes with maternal blood.',
      'During pregnancy, hormones increase plasma volume and red cell mass and relax blood vessels, so cardiac output rises while blood pressure often dips in mid-pregnancy. Maternal blood bathes the placenta, where oxygen and nutrients cross to fetal blood and carbon dioxide and wastes cross back, without the two blood supplies mixing.'),
    D('rs', 'ns', 'Provides chemical information: carbon dioxide and acidity sensed by chemoreceptors, and lung stretch.', 'Brainstem respiratory centres send rhythmic signals to the diaphragm and intercostal muscles.',
      'Carbon dioxide combines with water to form carbonic acid, so when carbon dioxide rises, blood and brain fluid become slightly more acidic. Chemoreceptors in the brainstem and in the carotid and aortic bodies detect this and the respiratory centre increases the depth and rate of breathing. More breathing removes carbon dioxide, acidity falls, and the drive to breathe eases: a negative feedback loop that runs every minute of your life.', true),
    D('rs', 're', 'Adjusts carbon dioxide within minutes.', 'Adjusts bicarbonate and acid excretion over hours to days.',
      'Blood pH depends on the balance between bicarbonate (a base) and carbon dioxide (which forms acid). The lungs change carbon dioxide quickly by breathing more or less. The kidneys reabsorb and make bicarbonate and excrete hydrogen ions, more slowly but powerfully. If one side is disturbed, the other compensates: for example, if breathing is reduced and carbon dioxide rises, the kidneys gradually keep more bicarbonate.', true),
    D('rs', 'ms', 'Supplies oxygen for aerobic ATP production and removes the carbon dioxide muscle makes.', 'The diaphragm and intercostals are skeletal muscles that power breathing; working muscle output of carbon dioxide drives breathing up.',
      'Breathing is itself muscle work: the diaphragm and intercostals contract to enlarge the chest. During exercise, working muscles produce more carbon dioxide and send signals from moving limbs, so ventilation increases. The extra breathing keeps arterial oxygen high and removes carbon dioxide, which lets muscle keep producing ATP aerobically.', true),
    D('rs', 'im', 'Airway surfaces are where many inhaled microbes are first met.', 'Mucus, cilia, alveolar macrophages and airway lymphoid tissue keep the lungs clean.',
      'Mucus traps inhaled particles and microbes, and beating cilia sweep it up and out of the airways to be swallowed or coughed. Anything that reaches the alveoli meets macrophages that engulf it. If microbes get past these defences, inflammation and the adaptive response follow.'),
    D('rs', 'rp', 'Supplies oxygen to mother, placenta and fetus.', 'Progesterone increases sensitivity to carbon dioxide, so breathing deepens in pregnancy.',
      'Progesterone makes the respiratory centre respond more strongly to carbon dioxide, so tidal volume rises. Maternal carbon dioxide falls slightly, increasing the gradient for fetal carbon dioxide to cross the placenta into maternal blood.'),
    D('ns', 'en', 'The hypothalamus controls the pituitary; sympathetic nerves trigger the adrenal medulla.', 'Hormones such as cortisol and thyroid hormone act back on the brain and change its activity.',
      'In a stressful moment, the fast arm is neural: sympathetic nerves act within seconds and stimulate the adrenal medulla to release adrenaline, which spreads the response through the blood. The slower arm is hormonal: the hypothalamus releases CRH, the pituitary releases ACTH, and the adrenal cortex releases cortisol over minutes to hours. Cortisol then inhibits CRH and ACTH release, so the system turns itself down when the stressor passes.', true),
    D('ns', 'di', 'The gut’s own enteric nervous system and the vagus nerve drive motility and secretion; sympathetic activity slows them.', 'Stretch and chemical signals from the gut tell the brain about fullness and gut contents.',
      'Food stretching the stomach and intestine triggers enteric reflexes that move and mix it. Parasympathetic signals, mainly through the vagus nerve, increase secretions and motility, while sympathetic signals reduce them during stress or exercise. Sensory signals travel back to the brain, contributing to feelings of fullness and nausea.', true),
    D('ns', 'ms', 'Motor neurons release acetylcholine at the neuromuscular junction to trigger contraction.', 'Muscle spindles and tendon organs report muscle length and tension.',
      'Each skeletal muscle contraction starts with a motor neuron action potential, acetylcholine release and a muscle action potential that releases calcium inside the fibre. Sensory receptors inside muscles constantly report length and tension, which the spinal cord and brain use to adjust force, posture and reflexes such as the knee jerk.', true),
    D('ns', 're', 'Sympathetic nerves narrow kidney arterioles, stimulate renin release and increase sodium reabsorption.', 'Angiotensin II, produced through the kidney’s renin, acts on the brain to increase thirst and ADH release.',
      'When blood pressure falls, sympathetic activity to the kidneys rises, reducing filtration, releasing renin and retaining sodium. The angiotensin II produced acts on the brain to trigger thirst and ADH release. Together these restore volume, after which sympathetic drive and renin fall.', true),
    D('ns', 'im', 'Stress hormones and autonomic signals modulate immune activity.', 'Immune signalling molecules (cytokines) act on the brain, causing fever, sleepiness and reduced appetite.',
      'During infection, cytokines from immune cells act on the hypothalamus, which makes prostaglandins that raise the temperature set point, and they change brain activity in ways that make us rest. In the other direction, cortisol released during stress dampens many immune responses, which helps prevent excessive inflammation.', true),
    D('di', 'en', 'Absorbed glucose raises blood glucose; gut hormones (incretins, CCK, secretin) are themselves endocrine signals.', 'Insulin and glucagon decide whether the liver and muscles store or release glucose.',
      'After a carbohydrate meal, digested glucose is absorbed and blood glucose rises. Beta cells in the pancreatic islets respond by releasing insulin, helped by incretin hormones from the gut that boost insulin release as food arrives. Insulin moves glucose into muscle and fat and promotes glycogen storage, so glucose falls back and insulin release decreases. Between meals, falling glucose triggers glucagon, which makes the liver release glucose.', true),
    D('en', 're', 'ADH, aldosterone and parathyroid hormone act on kidney tubules.', 'The kidneys release renin and erythropoietin and activate vitamin D (calcitriol).',
      'Hormones fine-tune the kidney: ADH adds water channels in collecting ducts, aldosterone increases sodium reabsorption and potassium secretion, and parathyroid hormone increases calcium reabsorption and stimulates vitamin D activation. The kidneys in turn act as an endocrine organ, releasing renin when perfusion falls and erythropoietin when oxygen delivery falls.', true),
    D('en', 'ms', 'Insulin drives glucose into muscle; parathyroid hormone and vitamin D move calcium in and out of bone; growth and thyroid hormones affect muscle and bone.', 'Bone stores calcium and phosphate; skeletal muscle is the largest site of insulin-stimulated glucose uptake.',
      'When blood calcium falls, parathyroid hormone releases calcium from bone and increases calcium reabsorption and vitamin D activation, raising calcium back to normal, after which parathyroid hormone falls. After meals, insulin directs much of the absorbed glucose into skeletal muscle, where it is stored as glycogen or used for energy.', true),
    D('en', 'rp', 'FSH and LH from the pituitary control the ovaries and testes.', 'The gonads secrete oestrogen, progesterone and testosterone, which feed back on the hypothalamus and pituitary; the placenta adds hCG and other hormones.',
      'GnRH from the hypothalamus triggers FSH and LH from the pituitary, which drive gamete development and sex hormone production. Sex hormones usually inhibit GnRH, FSH and LH (negative feedback), with an important exception just before ovulation, when high oestrogen briefly stimulates an LH surge. In pregnancy, hCG and placental hormones take over the support of the uterine lining.', true),
    D('di', 'ms', 'Supplies glucose, amino acids and fatty acids for muscle energy and repair.', 'Skeletal muscle stores glucose as glycogen; skeletal muscles power chewing and swallowing.',
      'Digested carbohydrate and protein provide the glucose and amino acids muscle needs. After meals, muscle takes up glucose under insulin’s influence and stores it as glycogen for later work, and amino acids support repair and growth. Muscle glycogen fuels the muscle itself rather than being released into the blood.'),
    D('di', 'im', 'Stomach acid and the gut lining form a barrier against swallowed microbes.', 'Gut lymphoid tissue monitors gut contents and makes antibodies (IgA) that protect the gut surface.',
      'Stomach acid kills many swallowed microbes, and the gut lining forms a tight barrier. Lymphoid tissue in the gut wall samples what passes and produces IgA antibodies that are secreted onto the gut surface, helping to neutralise microbes without triggering inflammation.'),
    D('ms', 'im', 'Red bone marrow produces all white blood cells.', 'Immune cells clear damaged tissue and support repair after muscle injury.',
      'White blood cells are made from stem cells in red bone marrow, inside bones. After strenuous exercise or injury, macrophages and other immune cells move into damaged muscle, clear debris and release signals that support repair.'),
    D('re', 'rp', 'Clears the extra metabolic wastes of mother and fetus.', 'Pregnancy increases kidney blood flow and filtration.',
      'In pregnancy, increased blood volume and kidney blood flow raise the glomerular filtration rate substantially, so wastes such as urea and creatinine are cleared faster.'),
    D('im', 'rp', 'Certain maternal antibodies (IgG) cross the placenta; breast milk carries antibodies (IgA).', 'Pregnancy adjusts maternal immune responses so the fetus is tolerated.',
      'The placenta actively transports IgG antibodies from mother to fetus, giving the newborn temporary protection. After birth, breast milk supplies IgA antibodies that protect the baby’s gut. During pregnancy, local immune adjustments at the placenta allow the genetically different fetus to be tolerated.')
  ];
  var byKey = {}; details.forEach(function (d) { byKey[d.key] = d; });
  BW.relations.forEach(function (r) {
    var d = byKey[r.a + '-' + r.b], rev = !d && byKey[r.b + '-' + r.a];
    if (d) { r.aGives = d.aGives; r.bGives = d.bGives; r.mechanism = d.mechanism; r.loop = d.loop; }
    else if (rev) { r.aGives = rev.bGives; r.bGives = rev.aGives; r.mechanism = rev.mechanism; r.loop = rev.loop; }
  });

  /* A system's view of one relationship. */
  BW.relationView = function (sys, r) {
    var mine = r.a === sys;
    return { other: mine ? r.b : r.a, gives: mine ? r.aGives : r.bGives, receives: mine ? r.bGives : r.aGives, mechanism: r.mechanism, loop: r.loop, text: r.text, lesson: r.lesson };
  };

  /* Where each analogy stops being accurate. */
  BW.analogyLimits = {
    'm1-l3': 'A float valve has one sensor and a fixed level. The body uses many sensors and effectors at once, and its set points can move, for example during fever.',
    'm1-l4': 'A thermostat is on or off, but body responses are graded. A stadium wave fades on its own, whereas physiological positive feedback needs a specific event, such as birth, to stop it.',
    'm1-l5': 'Molecules do not choose where to go: diffusion is the net result of random movement. And the pump moves ions in a fixed ratio, not as many as it likes.',
    'm2-l5': 'Dominoes cannot stand themselves back up, but a membrane recovers within milliseconds. The signal is also regenerated at each patch of membrane rather than pushed along.',
    'm3-l4': 'Rooms cannot squeeze, but chambers contract. The two “flats” beat together and pump the same volume per beat on average.',
    'm3-l7': 'Blood vessels are elastic and actively change diameter throughout the body, and the heart pumps in pulses rather than a steady flow like a tap.',
    'm4-l2': 'Opening a window can fully refresh a room, but each breath only partly replaces the air in the lungs, which is why alveolar oxygen is lower than in the atmosphere.',
    'm5-l5': 'A car has one accelerator and one brake for everything. The autonomic divisions can act on different organs selectively, and most blood vessels receive only sympathetic nerves.',
    'm6-l4': 'Insulin does not physically unlock a door. It binds a receptor and triggers signalling that moves glucose transporters to the membrane, and the brain and liver take up glucose without it.',
    'm7-l1': 'Digestion and absorption overlap in time and place; some final digestion happens on the surface of the very cells that absorb the products.',
    'm8-l2': 'You sort a cupboard one step at a time, but the nephron filters, reabsorbs and secretes continuously, in different segments at once, under hormonal control.',
    'm8-l6': 'In a relay each runner waits for the last. In RAAS all the components are present all the time, and angiotensin II acts on several targets in parallel.',
    'm9-l2': 'Tug-of-war hands pull in step and in one direction; myosin heads cycle independently and pull actin from both ends towards the centre.',
    'm10-l1': 'Guards and detectives are separate teams, but innate cells actively instruct the adaptive response, and antibodies make innate killing more effective.',
    'm11-l3': 'A fan and heater are on or off; the body grades many heat-loss and heat-gain responses at once, and behaviour such as seeking shade is part of control.',
    'm12-l4': 'A visitor does not redesign the house, but the placenta’s hormones actively reshape the mother’s body, and many changes start before extra demand exists.',
    'm13-l7': 'Water flows downhill under gravity. Oxygen moves by diffusion down partial pressure gradients at exchange surfaces and is carried between them by breathing and blood flow.'
  };

  function St(title, systems, text, lesson) { return { title: title, systems: systems, text: text, lesson: lesson }; }

  /* Scenario mode: follow one situation across the body. Each is simplified. */
  BW.scenarios = [
    { id: 'running', title: 'I begin running', summary: 'Within seconds, your brain, heart, lungs and muscles coordinate to deliver more oxygen and fuel to working muscle and to remove carbon dioxide and heat.',
      stages: [
        St('Brain starts the run', ['ns', 'ms'], 'Motor areas of the brain send signals to the leg muscles. At the same time (“central command”), the brainstem withdraws vagal tone and raises sympathetic output, so heart rate begins to rise within seconds, before muscle metabolism has changed much.', 'm5-l5'),
        St('Muscles use more ATP', ['ms'], 'Contracting muscle uses ATP rapidly and regenerates it from creatine phosphate, glycolysis and aerobic respiration. Oxygen use and carbon dioxide production rise.', 'm9-l2'),
        St('Local signals open muscle vessels', ['ms', 'cv'], 'Metabolites from working muscle (carbon dioxide, hydrogen ions, potassium, adenosine, lower oxygen) dilate its arterioles, so flow rises where it is needed. Sympathetic signals narrow vessels in the gut and kidneys, redirecting blood.', 'm13-l7'),
        St('The heart pumps more', ['cv', 'ns'], 'Sympathetic nerves and adrenaline raise heart rate and contraction strength. The muscle pump and deeper breathing return more blood to the heart, raising stroke volume. Cardiac output rises several-fold.', 'm3-l7'),
        St('Breathing increases', ['rs', 'ns'], 'Signals from moving limbs, the brain and rising carbon dioxide drive deeper, faster breathing, keeping arterial oxygen high and removing extra carbon dioxide.', 'm4-l2'),
        St('Muscle extracts more oxygen', ['cv', 'ms'], 'Warm, acidic, carbon dioxide-rich muscle makes haemoglobin release oxygen more readily (the Bohr effect), and muscle extracts a larger share of the oxygen delivered.', 'm13-l7'),
        St('Extra heat is lost', ['ns', 'cv'], 'Muscle heat raises core temperature, so the hypothalamus triggers sweating and skin vasodilation. Skin and muscle now compete for cardiac output.', 'm11-l3')
      ],
      loops: [{ a: 1, b: 4, label: 'Carbon dioxide from working muscle drives breathing up; breathing removes it (negative feedback).' }, { a: 3, b: 2, label: 'More flow washes metabolites out of muscle, which limits further dilation.' }],
      check: { prompt: 'Why does heart rate rise in the first few seconds of a run, before muscle metabolism has changed much?', options: ['The brain withdraws vagal tone and raises sympathetic output (central command)', 'Blood oxygen has already fallen sharply', 'The kidneys release renin', 'Lactate has built up in the blood'], answer: 0, explain: 'The earliest rise is neural. The brain lowers the parasympathetic brake on the SA node and raises sympathetic drive as you start moving. Metabolic signals add to it moments later.' },
      next: 'recovery' },
    { id: 'dehydration', title: 'I become dehydrated', summary: 'When you lose more water than you take in, the body senses both concentrated plasma and lower blood volume, then conserves water, protects blood pressure and makes you thirsty.',
      stages: [
        St('Water is lost', ['cv'], 'Sweat, moist exhaled air and urine remove water (and in illness, diarrhoea or vomiting). Plasma becomes more concentrated and, if losses continue, blood volume falls.', 'm1-l5'),
        St('Osmoreceptors notice', ['ns'], 'Osmoreceptor cells in the hypothalamus lose water by osmosis and shrink slightly, which increases their signalling.', 'm8-l2'),
        St('ADH and thirst', ['en', 'ns'], 'The posterior pituitary releases antidiuretic hormone (ADH), and you begin to feel thirsty.', 'm8-l2'),
        St('Kidneys save water', ['re'], 'ADH inserts aquaporin water channels in the collecting ducts, so more water returns to the blood and urine becomes small in volume and dark.', 'm8-l2'),
        St('Volume sensors respond', ['cv', 'ns', 're'], 'If blood volume falls enough, baroreceptors and the kidneys detect lower pressure. Sympathetic activity rises and renin starts the renin–angiotensin–aldosterone system.', 'm8-l6'),
        St('Sodium and water are kept', ['en', 're', 'cv'], 'Angiotensin II constricts vessels and strengthens thirst; aldosterone increases sodium reabsorption, and water follows, helping restore volume.', 'm8-l6'),
        St('Drinking restores balance', ['di', 're'], 'Water absorbed from the gut dilutes the plasma, ADH falls, thirst eases and the kidneys release any excess.', 'm7-l1')
      ],
      loops: [{ a: 6, b: 1, label: 'Drinking lowers plasma concentration, which switches off the osmoreceptor signal (negative feedback).' }, { a: 5, b: 4, label: 'Restored volume reduces renin release.' }],
      note: 'Severe dehydration, especially in babies, young children and older adults, needs medical care.',
      check: { prompt: 'Which hormone makes the kidneys reabsorb more water without reabsorbing more salt?', options: ['ADH (antidiuretic hormone)', 'Aldosterone', 'Insulin', 'Renin'], answer: 0, explain: 'ADH adds water channels to the collecting ducts. Aldosterone mainly increases sodium reabsorption, with water following.' } },
    { id: 'meal', title: 'I eat a carbohydrate-rich meal', summary: 'Digestion turns starch into glucose, absorption brings it into the blood, and insulin helps tissues take it up and store it, returning blood glucose towards baseline.',
      stages: [
        St('Starch is digested', ['di'], 'Salivary and pancreatic amylase break starch into smaller sugars; enzymes on the intestinal lining finish the job, releasing glucose.', 'm7-l1'),
        St('Glucose is absorbed', ['di', 'cv'], 'Glucose enters intestinal cells with sodium (SGLT1), leaves them into capillaries, and travels in the hepatic portal vein to the liver first.', 'm7-l1'),
        St('Gut hormones prime the pancreas', ['di', 'en'], 'Incretin hormones from the gut (such as GLP-1 and GIP) and vagal signals boost insulin release, so insulin starts rising as food arrives.', 'm6-l4'),
        St('Insulin is released', ['en'], 'Beta cells in the pancreatic islets respond to rising blood glucose by releasing insulin.', 'm6-l4'),

<script>

  'use strict';

        '<title id="' + id + 't">' + esc(meta.title) + '</title><desc id="' + id + 'd">' + esc(meta.desc) + '</desc>' +
        '<defs><marker id="' + id + 'a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ah"/></marker>' +
        '<marker id="' + id + 'b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ah-accent"/></marker></defs>',
      arrow: 'url(#' + id + 'a)', arrowB: 'url(#' + id + 'b)'

  }

  /* Numbered label: a badge plus text. In hide mode the text becomes a blank. */
  function tag(n, x, y, text, hide, anchor) {

    return '<g class="d-tag"><circle cx="' + bx + '" cy="' + (y - 5) + '" r="10" class="d-badge"/>' +
      '<text x="' + bx + '" y="' + (y - 1) + '" class="d-badge-t" text-anchor="middle">' + n + '</text>' +
      '<text x="' + x + '" y="' + y + '" class="d-label" text-anchor="' + anchor + '">' + (hide ? '?' : esc(text)) + '</text></g>';
  }
  function txt(x, y, s, cls, anchor) {
    return '<text x="' + x + '" y="' + y + '" class="' + (cls || 'd-small') + '" text-anchor="' + (anchor || 'start') + '">' + esc(s) + '</text>';
  }

  /* Generic flowchart renderer. */
  function flow(spec, opt) {
    var s = svgOpen(spec.w, spec.h, spec.key, spec.meta);
    var out = s.open, byId = {}, labels = '';
    spec.nodes.forEach(function (n) {
      var lines = (opt.hide && n.n ? '?' : n.label).split('\n');

      n._w = n.w || 150;
      byId[n.id] = n;
    });
    function clip(n, tx, ty) {
      var cx = n.x + n._w / 2, cy = n.y + n._h / 2, dx = tx - cx, dy = ty - cy;
      if (dx === 0 && dy === 0) return [cx, cy];

<script>
/* BodyWise — learner state. Everything is stored in this browser only
   (localStorage). If storage is blocked, the app still works for the session. */
(function (BW) {
  'use strict';
  var KEY = 'bodywise.v1';
  var DAY = 86400000;
  var INTERVALS = [0, 1, 3, 7, 14, 30]; // Leitner box → days until next review

  function today(d) {
    d = d ? new Date(d) : new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fresh() {
    return {
      v: 1, created: Date.now(),
      lessons: {}, attempts: [], quizzes: [], cards: {},
      saved: { lessons: [], terms: [] },
      notes: { lessons: {}, free: [] },
      prefs: { name: '', level: 'simple', theme: 'system', textSize: 'm', motion: 'system', jokes: true, voiceRate: 1, voiceName: '', tutorEndpoint: '', readingFont: false },
      activity: [], explored: {}, tutor: { history: [], lastTopic: null }
    };
  }

  var S = { state: fresh(), available: false, lastError: null, now: function () { return Date.now(); } };

  function probe() {
    try { var k = KEY + '.probe'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return true; } catch (e) { return false; }
  }

  S.load = function () {
    S.available = probe();
    if (!S.available) return S.state;
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) S.state = merge(fresh(), JSON.parse(raw));
    } catch (e) { S.lastError = 'Saved progress could not be read, so BodyWise started fresh.'; S.state = fresh(); }
    return S.state;
  };
  function merge(base, saved) {
    if (!saved || typeof saved !== 'object') return base;
    function plainObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }
    Object.keys(saved).forEach(function (k) {
      if (saved[k] === undefined) return;
      if (plainObj(base[k]) && plainObj(saved[k])) base[k] = merge(base[k], saved[k]);
      else if (base[k] === undefined || Array.isArray(base[k]) === Array.isArray(saved[k])) base[k] = saved[k];
    });
    return base;
  }
  S.save = function () {
    if (!S.available) return false;
    try { window.localStorage.setItem(KEY, JSON.stringify(S.state)); return true; }
    catch (e) { S.lastError = 'Progress could not be saved (storage may be full or blocked).'; return false; }
  };
  S.reset = function () { S.state = fresh(); S.save(); };

  S.logActivity = function () {
    var t = today(S.now());
    if (S.state.activity.indexOf(t) === -1) { S.state.activity.push(t); if (S.state.activity.length > 400) S.state.activity.shift(); }
  };
  S.streak = function () {
    var set = {}; S.state.activity.forEach(function (d) { set[d] = 1; });
    var n = 0, cursor = S.now();
    if (!set[today(cursor)]) { cursor -= DAY; if (!set[today(cursor)]) return 0; }
    while (set[today(cursor)]) { n++; cursor -= DAY; }
    return n;
  };

  /* Lessons */
  S.markStarted = function (id) {
    var l = S.state.lessons[id] = S.state.lessons[id] || {};
    if (!l.started) { l.started = S.now(); S.logActivity(); S.save(); }
  };
  S.markComplete = function (id) {
    var l = S.state.lessons[id] = S.state.lessons[id] || {};
    var first = !l.completed;
    if (!l.started) l.started = S.now();
    l.completed = S.now(); S.logActivity();
    var lesson = BW.lessonIndex[id];
    if (lesson && lesson.flashcards) lesson.flashcards.forEach(function (c, i) {
      var cid = id + '#' + i;
      if (!S.state.cards[cid]) S.state.cards[cid] = { box: 1, due: S.now() + DAY };
    });
    S.save(); return first;
  };
  S.unmarkComplete = function (id) { if (S.state.lessons[id]) { delete S.state.lessons[id].completed; S.save(); } };
  S.isComplete = function (id) { return !!(S.state.lessons[id] && S.state.lessons[id].completed); };
  S.isStarted = function (id) { return !!(S.state.lessons[id] && S.state.lessons[id].started); };

  /* Questions */
  S.recordAttempt = function (qid, lessonId, moduleId, correct) {
    S.state.attempts.push({ qid: qid, lesson: lessonId || null, module: moduleId || null, correct: !!correct, ts: S.now() });
    if (S.state.attempts.length > 600) S.state.attempts.splice(0, S.state.attempts.length - 600);
    S.logActivity(); S.save();
  };
  S.recordQuiz = function (label, score, total, ref) {
    S.state.quizzes.push({ label: label, score: score, total: total, ref: ref || null, ts: S.now() });
    if (S.state.quizzes.length > 100) S.state.quizzes.shift();
    S.save();
  };
  S.lessonStats = function (id) {
    var recent = S.state.attempts.filter(function (a) { return a.lesson === id; }).slice(-10);
    var c = recent.filter(function (a) { return a.correct; }).length;
    return { attempts: recent.length, correct: c, acc: recent.length ? c / recent.length : null };
  };
  S.moduleStats = function (mid) {
    var recent = S.state.attempts.filter(function (a) { return a.module === mid; }).slice(-30);
    var c = recent.filter(function (a) { return a.correct; }).length;
    return { attempts: recent.length, correct: c, acc: recent.length ? c / recent.length : null };
  };
  /* A topic needs revision when recent accuracy is below 70% over at least 2 answers. */
  S.needsRevision = function () {
    var seen = {};
    S.state.attempts.forEach(function (a) { if (a.lesson) seen[a.lesson] = 1; });
    return Object.keys(seen).map(function (id) { var st = S.lessonStats(id); return { id: id, acc: st.acc, attempts: st.attempts }; })
      .filter(function (r) { return r.attempts >= 2 && r.acc < 0.7; })
      .sort(function (a, b) { return a.acc - b.acc; });
  };

  /* Flashcards: simple Leitner boxes (1, 3, 7, 14, 30 days). Not an optimised algorithm. */
  S.dueCards = function () {
    var now = S.now();
    return Object.keys(S.state.cards).filter(function (id) { return S.state.cards[id].due <= now; });
  };
  S.reviewCard = function (id, knew) {
    var c = S.state.cards[id] || { box: 1 };
    c.box = knew ? Math.min(5, c.box + 1) : 1;
    c.due = S.now() + (knew ? INTERVALS[c.box] * DAY : 10 * 60000);
    c.last = S.now();
    S.state.cards[id] = c; S.logActivity(); S.save();
  };
  S.addTermCard = function (term) {
    var id = 'term:' + term;
    if (!S.state.cards[id]) { S.state.cards[id] = { box: 1, due: S.now() }; S.save(); }
  };
  S.nextDue = function () {
    var ids = Object.keys(S.state.cards); if (!ids.length) return null;
    return ids.map(function (i) { return S.state.cards[i].due; }).sort(function (a, b) { return a - b; })[0];
  };

  /* Saved items and notes */
  S.toggleSavedLesson = function (id) {
    var a = S.state.saved.lessons, i = a.indexOf(id);
    if (i === -1) a.push(id); else a.splice(i, 1);
    S.save(); return i === -1;
  };
  S.isSavedLesson = function (id) { return S.state.saved.lessons.indexOf(id) !== -1; };
  S.toggleSavedTerm = function (term) {
    var a = S.state.saved.terms, i = a.indexOf(term);
    if (i === -1) { a.push(term); S.addTermCard(term); } else { a.splice(i, 1); delete S.state.cards['term:' + term]; }
    S.save(); return i === -1;
  };
  S.isSavedTerm = function (t) { return S.state.saved.terms.indexOf(t) !== -1; };
  S.setLessonNote = function (id, text) {
    text = String(text || '').slice(0, 5000);
    if (text.trim()) S.state.notes.lessons[id] = { text: text, ts: S.now() }; else delete S.state.notes.lessons[id];
    S.save();
  };
  S.addFreeNote = function (text) {
    text = String(text || '').trim().slice(0, 5000);
    if (!text) return null;
    var n = { id: 'n' + S.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text, ts: S.now() };
    S.state.notes.free.unshift(n); S.save(); return n;
  };
  S.deleteFreeNote = function (id) { S.state.notes.free = S.state.notes.free.filter(function (n) { return n.id !== id; }); S.save(); };

  /* A system counts as explored once you open it in the explorer or start one of its lessons. */
  S.markExplored = function (sys) { if (!S.state.explored[sys]) { S.state.explored[sys] = S.now(); S.save(); } };
  S.exploredSystems = function () {
    var out = {};
    Object.keys(S.state.explored).forEach(function (k) { out[k] = true; });
    BW.systems.forEach(function (s) { s.lessons.forEach(function (id) { if (S.isStarted(id)) out[s.id] = true; }); });
    return out;
  };
  S.setPref = function (k, v) { S.state.prefs[k] = v; S.save(); };

  /* Completion counts only lessons that are fully written. */
  S.completion = function () {
    var full = BW.allLessons.filter(function (l) { return l.status === 'full'; });
    var done = full.filter(function (l) { return S.isComplete(l.id); });
    return { done: done.length, total: full.length, syllabus: BW.allLessons.length, pct: full.length ? Math.round(done.length / full.length * 100) : 0 };
  };
  S.nextLesson = function () {
    var full = BW.allLessons.filter(function (l) { return l.status === 'full'; });
    for (var i = 0; i < full.length; i++) if (S.isStarted(full[i].id) && !S.isComplete(full[i].id)) return full[i];
    for (var j = 0; j < full.length; j++) if (!S.isComplete(full[j].id)) return full[j];
    return null;
  };

  /* Backup: a text code the learner can copy and paste elsewhere. */
  S.exportCode = function () {
    var json = JSON.stringify(S.state);
    return 'BW1.' + btoa(unescape(encodeURIComponent(json)));
  };
  S.importCode = function (code) {
    code = String(code || '').trim();
    if (code.indexOf('BW1.') !== 0) throw new Error('This does not look like a BodyWise backup code. It should start with BW1.');
    var json;
    try { json = decodeURIComponent(escape(atob(code.slice(4)))); } catch (e) { throw new Error('The backup code is incomplete or damaged. Copy the whole code and try again.'); }
    var data; try { data = JSON.parse(json); } catch (e2) { throw new Error('The backup code could not be read.'); }
    if (!data || data.v !== 1) throw new Error('This backup is from an unsupported version.');
    S.state = merge(fresh(), data); S.save();
  };

  S._today = today;
  BW.store = S;
})(window.BW = window.BW || {});

</script>
<script>
/* BodyWise — question grading and the quiz player.
   Types: mcq, tf, short (key-idea check), label (diagram), scenario (mcq with a stem). */
(function (BW) {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function shuffle(a, rnd) { a = a.slice(); rnd = rnd || Math.random; for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function norm(t) { return String(t || '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9₂⁺\s-]/g, ' ').replace(/\s+/g, ' ').trim(); }

  var GOOD = ['Exactly right.', 'Spot on.', 'Yes, nicely reasoned.', 'Correct. Your physiology instincts are working.'];
  var BAD = ['Not quite, but this is a useful mistake. Let’s follow the pathway again.', 'Close, but not this time. Here is the reasoning.', 'Not quite. Mistakes like this are where the learning happens.'];

  /* Pure grading function, used by the UI and by the tests. */
  function grade(q, resp) {
    switch (q.type) {
      case 'mcq': case 'scenario':
        return { correct: Number(resp) === q.answer };
      case 'tf':
        var v = (resp === true || resp === 'true') ? true : (resp === false || resp === 'false') ? false : null;
        return { correct: v !== null && v === q.answer };
      case 'short': {
        var t = norm(resp), words = t ? t.split(' ').length : 0;
        var hits = (q.keywords || []).map(function (group) { return group.some(function (k) { return t.indexOf(norm(k)) !== -1; }); });
        return { correct: words >= 2 && hits.every(Boolean), hits: hits };
      }
      case 'label': {
        var per = {}, all = true;
        Object.keys(q.answers).forEach(function (n) { per[n] = resp && resp[n] === q.answers[n]; if (!per[n]) all = false; });
        return { correct: all, per: per };
      }
    }
    return { correct: false };
  }

  function contextOf(q) {
    if (q._lesson !== undefined) return q;
    return q;
  }

  /* Every question in the app, tagged with where it came from. */
  function allQuestions() {
    var out = [];
    BW.allLessons.forEach(function (l) {
      if (l.status !== 'full') return;
      (l.check || []).forEach(function (q) { out.push(Object.assign({ _lesson: l.id, _module: l.module }, q)); });
    });
    BW.systems.forEach(function (s) { s.quiz.forEach(function (q) { out.push(Object.assign({ _lesson: null, _module: null, _sys: s.id }, q)); }); });
    return out;
  }

  /* The quiz player. opts: {label, onDone(score,total), record (default true), compact} */
  function mount(el, questions, opts) {
    opts = opts || {};
    var qs = questions.slice(), i = 0, results = [], checked = false, order = {};
    if (!qs.length) { el.innerHTML = '<div class="empty">No questions are available here yet.</div>'; return; }

    function dots() {
      return '<div class="dots" aria-hidden="true">' + qs.map(function (_, k) {
        var c = results[k] == null ? '' : results[k] ? 'right' : 'wrong'; return '<i class="' + c + (k === i ? ' cur' : '') + '"></i>';
      }).join('') + '</div>';
    }

    function body(q) {
      var h = '';
      if (q.shown) h += '<p class="eyebrow">So far</p><ol class="mini-steps">' + q.shown.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '<li class="q" aria-hidden="true">?</li></ol>';
      if (q.type === 'scenario' && q.scenario) h += '<div class="scenario-stem"><span class="eyebrow">Scenario</span><br>' + esc(q.scenario) + '</div>';
      if (q.type === 'mcq' || q.type === 'scenario') {
        order[i] = order[i] || shuffle(q.options.map(function (_, k) { return k; }));
        h += '<fieldset><legend>' + esc(q.prompt) + '</legend>' + order[i].map(function (k) {
          return '<label class="opt" data-k="' + k + '"><input type="radio" name="q' + i + '" value="' + k + '"><span>' + esc(q.options[k]) + '</span><span class="mark"></span></label>';
        }).join('') + '</fieldset>';
      } else if (q.type === 'tf') {
        h += '<fieldset><legend><span class="eyebrow">True or false?</span><br>' + esc(q.prompt) + '</legend>' +
          ['true', 'false'].map(function (v) { return '<label class="opt" data-k="' + v + '"><input type="radio" name="q' + i + '" value="' + v + '"><span>' + (v === 'true' ? 'True' : 'False') + '</span><span class="mark"></span></label>'; }).join('') + '</fieldset>';
      } else if (q.type === 'short') {
        h += '<div class="field"><label for="qs' + i + '">' + esc(q.prompt) + '</label><textarea id="qs' + i + '" maxlength="600" placeholder="Type your answer in your own words"></textarea>' +
          '<span class="hint">A sentence is enough. BodyWise checks for the key idea, then shows a model answer to compare.</span></div>';
      } else if (q.type === 'label') {
        var nums = Object.keys(q.answers);
        order[i] = order[i] || shuffle(q.options);
        h += '<p><strong>' + esc(q.prompt) + '</strong></p><figure class="fig"><div class="figscroll">' + BW.diagram(q.diagram, { hide: true }) + '</div><figcaption>Choose the correct name for each numbered label.</figcaption></figure>' +
          '<div class="labelgrid">' + nums.map(function (n) {
            return '<div class="field" data-n="' + n + '"><label for="ql' + i + '_' + n + '">Label ' + n + '</label><select id="ql' + i + '_' + n + '"><option value="">Choose…</option>' +
              order[i].map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select><span class="hint ans"></span></div>';
          }).join('') + '</div>';
      }
      return h;
    }

    function render() {
